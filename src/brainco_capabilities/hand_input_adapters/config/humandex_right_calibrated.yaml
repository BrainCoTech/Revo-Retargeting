# Right glove samples: open / fist, 2026-09-07.
# For humandex_upstream_right.yaml: q = radians((encoder_deg - 180) * joint_scale).
# Requires independent encoders (joint_mimic_source: none), zero bias = 0.
# If upstream zero/signs change or glove fit changes, remeasure the endpoints.
# Each row: DIP, PIP, MCP. Finger order: index, middle, ring, little.
# Equal weights reproduce the previously tested RevoHuman three-encoder mapping.
/humandex_hand_adapter:
  ros__parameters:
    hand_mode: right
    four_finger_mapping: calibrated
    four_finger_weights: [1.0, 1.0, 1.0]
    four_finger_flexion_range_rad: 1.4661
    right_four_finger_open_rad: [
      0.492008316137, -0.264766447528, 0.209439510239,
      -0.053407075111, 0.328820031076, -0.022689280276,
      -0.271049632835, 0.017104226670, -0.132645023152,
      -0.338768407812, -0.285535865626, 0.175580122751
    ]
    right_four_finger_closed_rad: [
      1.737998869136, 1.095717704402, 1.405862712481,
      1.399754060099, 1.622283539729, 1.384569695607,
      -1.055924197457, 1.990198946049, 1.190838148636,
      -1.180191640199, 1.095892237327, 1.485798792223
    ]
