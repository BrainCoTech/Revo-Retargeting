# Thumb direction offset. The left palm frame differs from the right one, so the
# right-hand axis [1, 0, -1] does nothing here; [-1, 0, -1] is the only candidate that
# lowers MCP on 2026-11-09 left-glove data (replay MCP median 50 -> 40). On hardware
# (30 deg vs 0): relaxed MCP ~38 -> ~33 deg, opposition still at the 50 deg limit,
# CMP 5-10 deg larger. Small benefit only; opposition MCP is structural.
# Override per launch with thumb_offset_deg:=<deg>.
thumb_direction_offset:
  angle_deg: 30.0
  axis_palm: [-1.0, 0.0, -1.0]
