# Revo3 left-hand Modbus transport configuration.
hardware:
  slave_id: 126           # Left hand slave ID
  log_level: info
  port: /dev/ttyUSB0      # Ignored when auto_detect=true
  baudrate: 5000000
  auto_detect: true        # Scan serial ports and require slave_id=126
  auto_detect_quick: true
  auto_detect_port: ""
  read_decimation: 4
