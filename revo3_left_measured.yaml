# DV1 left Revo3 overrides.
# Four-finger MCP uses a shared 1.3 multiplier; PIP/DIP keep the original mapping.
# Per-joint output scales are 1.0 and output offsets are 0.0.
# MPR neutral offsets use the confirmed fingers-together pose; direction/range unverified.
# Left MPR spread scales reverse the default direction.
# Thumb DIP output multiplier set to 1 after the seven-pose recording at 11:30.
# This removes early DIP saturation; it does not calibrate the thumb workspace.
manus_revo3_retarget:
  ros__parameters:
    legacy_left_physical_thumb_dip_scale: 1.0
    legacy_left_physical_index_angle_scale: 1.0
    legacy_left_physical_four_finger_mcp_scale: 1.0
    legacy_left_physical_middle_ring_dip_scale: 1.0
    legacy_left_physical_pinky_angle_scale: 1.0
    legacy_left_physical_pinky_dip_pip_scale: 1.0
    legacy_left_physical_pinky_mcp_scale: 1.0
    legacy_left_physical_all_finger_angle_scale: 1.0
    physical_left_index_DIP_joint_scale: 1.0
    physical_left_index_DIP_joint_offset_deg: 0.0
    physical_left_index_PIP_joint_scale: 1.0
    physical_left_index_PIP_joint_offset_deg: 0.0
    physical_left_index_MCP_joint_scale: 1.0
    physical_left_index_MCP_joint_offset_deg: 0.0
    physical_left_middle_DIP_joint_scale: 1.0
    physical_left_middle_DIP_joint_offset_deg: 0.0
    physical_left_middle_PIP_joint_scale: 1.0
    physical_left_middle_PIP_joint_offset_deg: 0.0
    physical_left_middle_MCP_joint_scale: 1.0
    physical_left_middle_MCP_joint_offset_deg: 0.0
    physical_left_ring_DIP_joint_scale: 1.0
    physical_left_ring_DIP_joint_offset_deg: 0.0
    physical_left_ring_PIP_joint_scale: 1.0
    physical_left_ring_PIP_joint_offset_deg: 0.0
    physical_left_ring_MCP_joint_scale: 1.2
    physical_left_ring_MCP_joint_offset_deg: 15.0
    physical_left_little_DIP_joint_scale: 1.0
    physical_left_little_DIP_joint_offset_deg: 0.0
    physical_left_little_PIP_joint_scale: 1.0
    physical_left_little_PIP_joint_offset_deg: 0.0
    physical_left_little_MCP_joint_scale: 1.0
    physical_left_little_MCP_joint_offset_deg: 15.0
    legacy_left_physical_index_spread_scale: 0.8
    legacy_left_physical_index_spread_offset_deg: -5.2599999999999785
    legacy_left_physical_middle_spread_scale: 0.8
    legacy_left_physical_middle_spread_offset_deg: -3.8100000000000174
